<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a25">
  <meta name="description" content="Igor Sorente — novo site em preparação. Em breve, novidades.">
  <meta name="robots" content="noindex, nofollow">
  <title>Igor Sorente — Em breve</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --bg:#101a25; --text:#f5f4f0; --muted:#b5bdc4; --accent:#d9b889; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body { min-height:100svh; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body::before { content:""; position:fixed; inset:0; background:radial-gradient(ellipse at 75% 10%,rgba(217,184,137,.09),transparent 43%),radial-gradient(ellipse at 0 100%,rgba(60,89,105,.21),transparent 56%); pointer-events:none; }
    .shell { min-height:100svh; position:relative; display:flex; flex-direction:column; padding:clamp(28px,5vw,64px); }
    header { display:flex; align-items:center; gap:15px; }
    .monogram { width:43px;height:43px;border:1px solid rgba(217,184,137,.65); display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;font-size:21px;letter-spacing:-2px;color:var(--accent); }
    .brand { font-size:14px; letter-spacing:.21em; font-weight:600; text-transform:uppercase; }
    main { width:min(100%,800px); flex:1; display:flex; flex-direction:column; justify-content:center; padding:80px 0 96px; }
    .eyebrow { color:var(--accent); letter-spacing:.26em; font-size:12px; font-weight:700; text-transform:uppercase; margin:0 0 26px; }
    h1 { font-size:clamp(54px,9vw,110px); letter-spacing:-.065em; line-height:.99; font-weight:600; margin:0 0 30px; }
    h1 em { font-family:Georgia,"Times New Roman",serif; font-weight:400; color:var(--accent); }
    p.copy { max-width:490px; color:var(--muted); font-size:clamp(17px,2vw,20px); line-height:1.8; margin:0; }
    .rule { margin:42px 0 0; width:64px; height:2px; background:var(--accent); }
    footer { display:flex; justify-content:space-between; align-items:center; gap:24px; border-top:1px solid rgba(255,255,255,.12); padding-top:24px; font-size:12px; letter-spacing:.05em; color:#8896a2; }
    footer span:last-child { text-align:right; }
    @media(max-width:520px){ .shell{padding:28px 25px}.brand{font-size:12px}main{padding:90px 0}footer{flex-direction:column;align-items:flex-start;gap:7px}footer span:last-child{text-align:left} }
    @media(prefers-reduced-motion:no-preference){main{animation:rise .75s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
<div class="shell">
  <header aria-label="Igor Sorente"><div class="monogram" aria-hidden="true">IS</div><div class="brand">Igor Sorente</div></header>
  <main>
    <p class="eyebrow">Uma nova experiência está chegando</p>
    <h1>Em breve,<br><em>novidades.</em></h1>
    <p class="copy">Estamos preparando um novo espaço digital. Em breve, você encontrará tudo por aqui.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
  <footer><span>© <span id="year">2026</span> Igor Sorente</span><span>igorsorente.com.br</span></footer>
</div>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
